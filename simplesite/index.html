<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SimpleSite — Matheus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header><h1>SimpleSite</h1><p>Landing pronta para deploy</p></header>
  <main>
    <section class="hero">
      <h2>Olá, eu sou Matheus (YUUQUE)</h2>
      <p>Desenvolvedor de bots e sites — este é um template rápido.</p>
      <a class="cta" href="#contact">Fale comigo</a>
    </section>

    <section id="contact">
      <h3>Contato</h3>
      <form action="https://formspree.io/f/YOURENDPOINT" method="POST">
        <input name="name" placeholder="Nome" required>
        <input name="email" type="email" placeholder="Email" required>
        <textarea name="message" placeholder="Mensagem" required></textarea>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
  <footer>© Matheus - YUUQUE</footer>
</body>
</html>
